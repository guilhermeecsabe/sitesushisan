<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu perfil - Sushi San</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <a class="logo" href="index.html">🍣 Sushi San</a>
    <button class="hamburguer" onclick="abrirMenu()" aria-label="Abrir menu">☰</button>
    <nav id="menu" class="menu">
      <a href="index.html">Início</a>
      <a href="produtos.html">Produtos</a>
      <a href="pedidos.html">Pedidos</a>
      <a href="carrinho.html">Carrinho <span class="contador">0</span></a>
      <a href="perfil.html">Perfil</a>
      <span id="areaLogin">
        <a class="btn-mini" href="login.html">Entrar</a>
        <a class="btn-mini destaque" href="login.html?aba=cadastro">Cadastrar</a>
      </span>
      <button id="btnTema" class="tema" onclick="trocarTema()">☀️</button>
    </nav>
  </header>

  <main class="caixa larga">
    <h2>MEU PERFIL</h2>

    <form onsubmit="return salvarPerfil()">
      <div class="campo">
        <label for="perNome">Nome completo</label>
        <input type="text" id="perNome" maxlength="50" oninput="somenteLetras(this)" required>
      </div>
      <div class="duas-colunas">
        <div class="campo">
          <label for="perEmail">E-mail (não pode ser alterado)</label>
          <input type="email" id="perEmail" disabled>
        </div>
        <div class="campo">
          <label for="perCpf">CPF (não pode ser alterado)</label>
          <input type="text" id="perCpf" disabled>
        </div>
      </div>
      <div class="duas-colunas">
        <div class="campo">
          <label for="perTelefone">Telefone</label>
          <input type="text" id="perTelefone" maxlength="15" inputmode="numeric" oninput="mascara(this, 'telefone')" required>
        </div>
        <div class="campo">
          <label for="perCep">CEP</label>
          <input type="text" id="perCep" maxlength="9" inputmode="numeric" oninput="mascara(this, 'cep')" required>
        </div>
      </div>
      <div class="duas-colunas">
        <div class="campo">
          <label for="perEndereco">Endereço</label>
          <input type="text" id="perEndereco" maxlength="80" required>
        </div>
        <div class="campo">
          <label for="perNumero">Número</label>
          <input type="text" id="perNumero" maxlength="6" inputmode="numeric" oninput="somenteNumeros(this)" required>
        </div>
      </div>
      <button class="btn" type="submit" style="width:100%">Salvar alterações</button>
    </form>

    <div class="duas-colunas" style="margin-top:16px">
      <button class="btn contorno" onclick="sair()">Sair da conta</button>
      <button class="btn contorno" onclick="excluirConta()">Excluir conta</button>
    </div>
  </main>

  <footer class="rodape">
    <div class="rodape-grade">
      <div><h4>🍣 Sushi San</h4><p>Frescor de verdade, em qualquer hora.</p></div>
      <div><h4>Navegação</h4><a href="produtos.html">Produtos</a><a href="pedidos.html">Meus pedidos</a><a href="carrinho.html">Carrinho</a></div>
      <div><h4>Conta</h4><a href="login.html">Entrar</a><a href="login.html?aba=cadastro">Cadastrar</a><a href="perfil.html">Perfil</a></div>
      <div><h4>Contato</h4><p>(31) 99690-5239 </p><p>22500367@aluno.cotemig.com</p></div>
    </div>
    <p class="copy">© 2026 Sushi San - Site sushi </p>
  </footer>

  <script src="script.js"></script>
  <script>mostrarPerfil();</script>
</body>
</html>
